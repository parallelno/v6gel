[project]
name = "v6gel-pipeline"
version = "0.1.0"
description = "Asset pipeline for the v6gel game engine library (Vector-06c)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "Pillow>=10.0",
    "lhafile>=0.3.0",
    "PyQt6>=6.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
v6export = "v6gel.cli.v6export:main"
v6loads = "v6gel.cli.v6loads:main"
v6build-assets = "v6gel.cli.build_assets:main"
v6clear = "v6gel.cli.clear:main"
v6font-editor = "v6gel.tools.font_editor.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["v6gel*"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
# A small, sensible starter set: pyflakes (F), pycodestyle (E/W),
# isort (I) and a few bug-catching pyupgrade/flake8-bugbear rules.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
# The codebase indents with tabs; keep ruff's formatter consistent with that.
indent-style = "tab"
